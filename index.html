<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менин чакыруум</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
        }
        .card { 
            background: white; padding: 25px 20px; border-radius: 20px; 
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 85%; max-width: 350px; 
        }
        h1 { font-size: 20px; color: #333; margin-bottom: 15px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; text-align: left; margin-left: 5%; }
        
        /* Форма элементтеринин стили */
        input[type="datetime-local"], select, input[type="text"] { 
            padding: 12px; font-size: 16px; border-radius: 10px; 
            border: 1px solid #ddd; margin-top: 5px; width: 85%; 
            background-color: #fafafa;
        }
        
        /* Баскычтар */
        button { 
            padding: 12px 24px; margin: 10px 5px; border: none; 
            border-radius: 10px; font-size: 16px; cursor: pointer; 
            font-weight: bold; transition: 0.2s;
        }
        .yes { background-color: #ff4081; color: white; width: 85%; margin-top: 20px; }
        .no { background-color: #e0e0e0; color: #333; width: 85%; }
        .confirm-btn { background-color: #4CAF50; color: white; width: 90%; margin-top: 20px; }
        
        /* Жашыруун турган бөлүктөр */
        #dateSection { display: none; }
        
        /* Кичинекей экрандар үчүн */
        @media (max-height: 600px) {
            body { align-items: flex-start; padding-top: 20px; overflow-y: auto; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 1-бөлүк: Баштапкы суроо -->
        <div id="questionSection">
            <h1>Сен мени менен жолугушууга барасыңбы? 🐱💖</h1>
            <button class="yes" onclick="showDetails()">Ооба ❤️</button>
            <button class="no" onclick="closeApp()">Жок</button>
        </div>

        <!-- 2-бөлүк: Дата, Убакыт жана Тамак тандоо -->
        <div id="dateSection">
            <h1>Сонун! Качан жана эмне жегибиз келет? 😋</h1>
            
            <label>📅 Күнү жана убактысы:</label>
            <input type="datetime-local" id="meetingDate">
            
            <label>🍔 Эмне жегибиз келет?</label>
            <select id="foodChoice">
                <option value="Кафеда отуруп тамактанабыз">☕ Кафеда тамактанабыз</option>
                <option value="Пицца жейбиз">🍕 Пицца жейбиз</option>
                <option value="Суши жейбиз">🍣 Суши жейбиз</option>
                <option value="Бургер жейбиз">🍔 Бургер жейбиз</option>
                <option value="Башка (өзүм жазам)">✍️ Башка (өзүм жазам)</option>
            </select>

            <!-- Эгер "Башканы" тандаса, бул тексттик талаа чыгат -->
            <div id="customFoodDiv" style="display:none;">
                <label>Эмне жегиңиз келет? (жазыңыз):</label>
                <input type="text" id="customFood" placeholder="Мисалы: Лагман, Манты...">
            </div>

            <button class="confirm-btn" onclick="sendData()">Ырастоо 💌</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Экранды толук ачуу

        // "Ооба" басканда экинчи бөлүктү көрсөтүү
        function showDetails() {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('dateSection').style.display = 'block';
        }

        // "Жок" басканда жабуу
        function closeApp() {
            tg.close();
        }

        // Тандоону өзгөртүү (Башка тандалса тексттик талаа чыгат)
        document.getElementById('foodChoice').addEventListener('change', function() {
            let customDiv = document.getElementById('customFoodDiv');
            if (this.value === "Башка (өзүм жазам)") {
                customDiv.style.display = 'block';
            } else {
                customDiv.style.display = 'none';
            }
        });

        // "Ырастоо" басканда маалыматты ботко жөнөтүү
        function sendData() {
            let selectedDate = document.getElementById('meetingDate').value;
            let foodSelect = document.getElementById('foodChoice').value;
            let customFood = document.getElementById('customFood').value;

            // Текшерүү: Дата тандалдыбы?
            if (!selectedDate) {
                tg.showAlert("Сураныч, датаны жана убакытты тандаңыз!");
                return;
            }

            // Эгер "Башка" тандалып, бирок текст жазылбаса
            let finalFood = foodSelect;
            if (foodSelect === "Башка (өзүм жазам)") {
                if (!customFood) {
                    tg.showAlert("Сураныч, эмне жегиңиз келерин жазыңыз!");
                    return;
                }
                finalFood = customFood; // Жазган тексти колдонобуз
            }

            // Ботко маалыматты топтойбуз: "user_said_yes|2026-11-20T18:30|Пицца"
            let messageData = "user_said_yes|" + selectedDate + "|" + finalFood;
            
            tg.sendData(messageData);
            tg.showAlert("Сонун! Кабыл алынды, жакында байланышам 😉");
            tg.close(); 
        }
    </script>
</body>
</html>
