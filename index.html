<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чакыруу 💌</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
    min-height: 100vh;
    padding: 20px;
    color: #2c2c2c;
}
.card {
    background: #fff;
    border-radius: 24px;
    padding: 30px 24px;
    max-width: 420px;
    margin: 0 auto;
    box-shadow: 0 20px 60px rgba(238,156,167,0.4);
    text-align: center;
}
.emoji { font-size: 60px; margin-bottom: 16px; display: block; }
h1 { font-size: 22px; color: #d63384; margin-bottom: 16px; line-height: 1.3; }
.message {
    background: #fff5f7;
    border-left: 4px solid #ee9ca7;
    padding: 16px;
    border-radius: 12px;
    margin: 20px 0;
    font-style: italic;
    color: #555;
    text-align: left;
    line-height: 1.5;
}
.label {
    display: block;
    text-align: left;
    font-weight: 600;
    margin: 20px 0 8px;
    color: #d63384;
    font-size: 14px;
}
input[type="datetime-local"], select {
    width: 100%;
    padding: 14px;
    border: 2px solid #ffdde1;
    border-radius: 12px;
    font-size: 16px;
    background: #fff;
    color: #2c2c2c;
    outline: none;
}
input[type="datetime-local"]:focus, select:focus { border-color: #ee9ca7; }
button {
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    background: linear-gradient(135deg, #ee9ca7 0%, #d63384 100%);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(214,51,132,0.4);
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.6; }
.status { margin-top: 16px; font-size: 14px; color: #888; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
    <span class="emoji">💌</span>
    <h1 id="title">Сизге чакыруу келди!</h1>
    <div class="message" id="message"></div>

    <label class="label">📅 Качан жолугабыз?</label>
    <input type="datetime-local" id="date">

    <label class="label">🍔 Эмне жегиңиз келет?</label>
    <select id="food">
        <option value="Пицца 🍕">Пицца 🍕</option>
        <option value="Суши 🍣">Суши 🍣</option>
        <option value="Бургер 🍔">Бургер 🍔</option>
        <option value="Лагман 🍜">Лагман 🍜</option>
        <option value="Манты 🥟">Манты 🥟</option>
        <option value="Кофе ☕">Кофе ☕</option>
        <option value="Мороженое 🍦">Мороженое 🍦</option>
    </select>

    <button id="submitBtn" onclick="onSubmit()">Ооба, барам! ❤️</button>
    <div class="status" id="status"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Түстөрдү Telegram'га ылайыктоо
try { tg.setHeaderColor('#ffdde1'); tg.setBackgroundColor('#ffdde1'); } catch(e) {}

const params = new URLSearchParams(window.location.search);
const inviteId = params.get('invite_id') || '';
const creatorId = params.get('creator_id') || '';
const msg = params.get('msg') || 'Сизди тамакка чакырам!';
const sender = params.get('sender') || 'Бирөө';

document.getElementById('title').textContent = `${sender} сизди чакырат 💕`;
document.getElementById('message').textContent = `"${msg}"`;

// Дата минимум — бүгүн
const now = new Date();
now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
document.getElementById('date').min = now.toISOString().slice(0, 16);

function onSubmit() {
    const dateVal = document.getElementById('date').value;
    const foodVal = document.getElementById('food').value;
    const status = document.getElementById('status');

    if (!dateVal) {
        status.textContent = '⚠️ Өтүнүч, күн менен убакытты тандаңыз';
        return;
    }
    if (!inviteId || !creatorId) {
        status.textContent = '⚠️ Шилтеме туура эмес';
        return;
    }

    const payload = {
        invite_id: inviteId,
        creator_id: parseInt(creatorId),
        date: dateVal,
        food: foodVal
    };

    console.log('Жөнөтүлүүчү:', payload);

    try {
        tg.sendData(JSON.stringify(payload));
        document.getElementById('submitBtn').disabled = true;
        status.textContent = '✅ Жөнөтүлдү!';
    } catch (e) {
        console.error('Ката:', e);
        status.textContent = '⚠️ Ката: ' + e.message;
    }
}
</script>
</body>
</html>
