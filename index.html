<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Чакыруу 💌</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
        background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #2c2c2c;
    }
    .page {
        background: #fff;
        border-radius: 24px;
        padding: 30px 24px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(238,156,167,0.4);
        text-align: center;
        display: none; /* Башында баары жашыруун */
        animation: fadeIn 0.4s ease;
    }
    .page.active { display: block; } /* Учурдагы бет гана көрүнөт */

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .emoji { font-size: 65px; margin-bottom: 15px; display: block; }
    h1 { font-size: 22px; color: #d63384; margin-bottom: 20px; line-height: 1.3; }
    
    .sender-name { font-size: 16px; color: #888; margin-bottom: 10px; }
    
    .message {
        background: #fff5f7;
        border-left: 4px solid #ee9ca7;
        padding: 20px 16px;
        border-radius: 12px;
        margin: 20px 0 30px;
        font-size: 18px;
        font-weight: 500;
        font-style: italic;
        color: #444;
        line-height: 1.5;
        box-shadow: 0 4px 15px rgba(238,156,167,0.2);
    }

    .label {
        display: block;
        text-align: left;
        font-weight: 600;
        margin: 15px 0 8px;
        color: #d63384;
        font-size: 15px;
    }

    input[type="datetime-local"], select {
        width: 100%;
        padding: 16px;
        border: 2px solid #ffdde1;
        border-radius: 14px;
        font-size: 16px;
        background: #fafafa;
        color: #2c2c2c;
        outline: none;
        transition: 0.2s;
    }
    input[type="datetime-local"]:focus, select:focus { border-color: #ee9ca7; background: #fff; }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 10px;
        border: none;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    button:active { transform: scale(0.96); }

    .btn-yes {
        background: linear-gradient(135deg, #ee9ca7 0%, #d63384 100%);
        color: #fff;
        box-shadow: 0 8px 24px rgba(214,51,132,0.3);
        margin-top: 20px;
    }
    .btn-no {
        background: #f0f0f0;
        color: #888;
        margin-top: 10px;
    }
    .btn-next {
        background: linear-gradient(135deg, #ee9ca7 0%, #d63384 100%);
        color: #fff;
        box-shadow: 0 8px 24px rgba(214,51,132,0.3);
        margin-top: 25px;
    }
</style>
</head>
<body>

    <!-- 1-БЕТ: Чакыруу жана Ооба/Жок -->
    <div class="page active" id="page1">
        <span class="emoji">💌</span>
        <h1>Сизге чакыруу келди!</h1>
        <div class="sender-name" id="senderName"></div>
        
        <!-- Чакырган адамдын өз сөзү ушул жерде чоң көрүнөт -->
        <div class="message" id="customMessage"></div>

        <button class="btn-yes" onclick="goToPage(2)">Ооба, барам! ❤️</button>
        <button class="btn-no" onclick="sayNo()">Жок, бара албайм 💔</button>
    </div>

    <!-- 2-БЕТ: Убакыт тандоо -->
    <div class="page" id="page2">
        <span class="emoji">📅</span>
        <h1>Сонун! Качан жолугабыз?</h1>
        
        <label class="label">Күн жана убакытты тандаңыз:</label>
        <input type="datetime-local" id="date">
        
        <button class="btn-next" onclick="checkDate()">Кийинки ➡️</button>
    </div>

    <!-- 3-БЕТ: Тамак тандоо жана Жөнөтүү -->
    <div class="page" id="page3">
        <span class="emoji">🍔</span>
        <h1>Акыркы суроо...</h1>
        
        <label class="label">Эмне жегиңиз келет?</label>
        <select id="food">
            <option value="Пицца 🍕">Пицца 🍕</option>
            <option value="Суши 🍣">Суши 🍣</option>
            <option value="Бургер 🍔">Бургер 🍔</option>
            <option value="Лагман 🍜">Лагман 🍜</option>
            <option value="Манты 🥟">Манты 🥟</option>
            <option value="Кофе жана торт ☕">Кофе жана торт ☕</option>
            <option value="Мороженое 🍦">Мороженое 🍦</option>
        </select>
        
        <button class="btn-next" onclick="sendData()">Жөнөтүү ✅</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // URL'ден маалыматтарды алуу
    const params = new URLSearchParams(window.location.search);
    const inviteId = params.get('invite_id') || '';
    const creatorId = params.get('creator_id') || '';
    const msg = params.get('msg') || 'Мени менен убакыт өткөрүүгө чакырам!';
    const sender = params.get('sender') || 'Бирөө';

    // 1-бетти толтуруу
    document.getElementById('senderName').textContent = `${sender} сизди чакырат:`;
    document.getElementById('customMessage').textContent = `"${msg}"`;

    // Дата минимум - азыркы убакыт
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('date').min = now.toISOString().slice(0, 16);

    // Баракчаларды алмаштыруу функциясы
    function goToPage(pageNum) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + pageNum).classList.add('active');
    }

    // "Жок" басканда
    function sayNo() {
        tg.showAlert("Түшүндүм. Жакшы күн каалайм! 😊", function() {
            tg.close();
        });
    }

    // 2-беттен 3-бетке өтүү
    function checkDate() {
        const dateVal = document.getElementById('date').value;
        if (!dateVal) {
            tg.showAlert("⚠️ Өтүнүч, күн менен убакытты тандаңыз!");
            return;
        }
        goToPage(3);
    }

    // 3-бетте "Жөнөтүүнү" басканда
    function sendData() {
        const dateVal = document.getElementById('date').value;
        const foodVal = document.getElementById('food').value;

        const payload = {
            invite_id: inviteId,
            creator_id: parseInt(creatorId),
            date: dateVal,
            food: foodVal
        };

        // Ботко маалыматты жөнөтүү
        tg.sendData(JSON.stringify(payload));
        tg.close();
    }
</script>
</body>
</html>
