<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менин чакыруум</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 85%; max-width: 350px; }
        h1 { font-size: 20px; color: #333; margin-bottom: 15px; }
        
        /* Жигит жазган сөздүн стили */
        .custom-msg { 
            font-style: italic; color: #ff4081; font-size: 18px; 
            background: #fff0f5; padding: 15px; border-radius: 10px; 
            margin-bottom: 20px; border-left: 4px solid #ff4081;
        }

        label { display: block; margin-top: 15px; font-weight: bold; color: #555; text-align: left; margin-left: 5%; }
        input[type="datetime-local"], select, input[type="text"] { padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ddd; margin-top: 5px; width: 85%; background-color: #fafafa; }
        button { padding: 12px 24px; margin: 10px 5px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .yes { background-color: #ff4081; color: white; width: 85%; margin-top: 20px; }
        .no { background-color: #e0e0e0; color: #333; width: 85%; }
        .confirm-btn { background-color: #4CAF50; color: white; width: 90%; margin-top: 20px; }
        #dateSection { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div id="questionSection">
            <!-- Бул жерде жигит жазган сөз чыгат -->
            <div id="customMessageBox" class="custom-msg"></div>
            
            <button class="yes" onclick="showDetails()">Ооба ❤️</button>
            <button class="no" onclick="closeApp()">Жок</button>
        </div>

        <div id="dateSection">
            <h1>Сонун! Качан жана эмне жегибиз келет? 😋</h1>
            <label>📅 Күнү жана убактысы:</label>
            <input type="datetime-local" id="meetingDate">
            
            <label>🍔 Эмне жегибиз келет?</label>
            <select id="foodChoice">
                <option value="Кафеда отуруп тамактанабыз">☕ Кафеда тамактанабыз</option>
                <option value="Пицца жейбиз">🍕 Пицца жейбиз</option>
                <option value="Суши жейбиз">🍣 Суши жейбиз</option>
                <option value="Бургер жейбиз">🍔 Бургер жейбиз</option>
                <option value="Башка (өзүм жазам)">✍️ Башка (өзүм жазам)</option>
            </select>

            <div id="customFoodDiv" style="display:none;">
                <label>Эмне жегиңиз келет?</label>
                <input type="text" id="customFood" placeholder="Мисалы: Лагман, Манты...">
            </div>

            <button class="confirm-btn" onclick="sendData()">Ырастоо 💌</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // URL'ден маалыматтарды окуйбуз
        let urlParams = new URLSearchParams(window.location.search);
        let inviteId = urlParams.get('invite_id') || "default";
        let creatorId = urlParams.get('creator_id') || "0";
        let customMsg = urlParams.get('msg') || "Мен сени жолугушууга чакырам!";
        let senderName = urlParams.get('sender') || "Бирөө"; // Жигиттин атын алабыз

        // Жигит жазган сөздү жана атын экранга чыгарабыз
        document.getElementById('customMessageBox').innerHTML = '<span style="font-size:14px; color:#555; display:block; margin-bottom:5px;">' + senderName + ' деген жигиттен:</span>"' + customMsg + '"';

        function showDetails() {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('dateSection').style.display = 'block';
        }

        function closeApp() { tg.close(); }

        document.getElementById('foodChoice').addEventListener('change', function() {
            let customDiv = document.getElementById('customFoodDiv');
            customDiv.style.display = (this.value === "Башка (өзүм жазам)") ? 'block' : 'none';
        });

        function sendData() {
            let selectedDate = document.getElementById('meetingDate').value;
            let foodSelect = document.getElementById('foodChoice').value;
            let customFood = document.getElementById('customFood').value;

            if (!selectedDate) { tg.showAlert("Сураныч, датаны тандаңыз!"); return; }

            let finalFood = foodSelect;
            if (foodSelect === "Башка (өзүм жазам)") {
                if (!customFood) { tg.showAlert("Эмне жегиңиз келерин жазыңыз!"); return; }
                finalFood = customFood;
            }

            let messageData = inviteId + "|" + creatorId + "|" + selectedDate + "|" + finalFood;
            tg.sendData(messageData);
            tg.showAlert("Сонун! Кабыл алынды 😉");
            tg.close(); 
        }
    </script>
</body>
</html>
