<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менин чакыруум</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #ffe4e1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 300px; }
        h1 { font-size: 20px; color: #333; margin-bottom: 20px; }
        button { padding: 12px 24px; margin: 10px 5px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .yes { background-color: #ff4081; color: white; }
        .no { background-color: #ddd; color: #333; }
        
        /* Дата тандоо бөлүмү (башында жашыруун турат) */
        #dateSection { display: none; }
        input[type="datetime-local"] { padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px; width: 85%; }
        .confirm-btn { background-color: #4CAF50; color: white; width: 85%; }
    </style>
</head>
<body>
    <div class="card">
        <!-- 1-бөлүк: Баштапкы суроо -->
        <div id="questionSection">
            <h1>Сен мени менен жолугушууга барасыңбы? 🐱</h1>
            <button class="yes" onclick="showDate()">Ооба ❤️</button>
            <button class="no" onclick="closeApp()">Жок</button>
        </div>

        <!-- 2-бөлүк: Дата жана убакыт тандоо -->
        <div id="dateSection">
            <h1>Сонун! Качан жана саат канчада жолугабыз? 📅</h1>
            <input type="datetime-local" id="meetingDate">
            <br>
            <button class="confirm-btn" onclick="sendDate()">Ырастоо</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Экранды толук ачуу

        // "Ооба" басканда дата тандоону көрсөтүү
        function showDate() {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('dateSection').style.display = 'block';
        }

        // "Жок" басканда жабуу
        function closeApp() {
            tg.close();
        }

        // Датаны тандап "Ырастоо" басканда ботко жөнөтүү
        function sendDate() {
            let selectedDate = document.getElementById('meetingDate').value;
            
            // Эгер колдонуучу датаны тандабай койсо эскертүү
            if (!selectedDate) {
                tg.showAlert("Сураныч, датаны жана убакытты тандаңыз!");
                return;
            }
            
            // Ботко "user_said_yes|2026-11-20T18:30" форматында жөнөтөбүз
            tg.sendData("user_said_yes|" + selectedDate);
            tg.showAlert("Сонун! Жолугушуу убактыңыз кабыл алынды 😉");
            tg.close(); // Баракчаны жабуу
        }
    </script>
</body>
</html>
