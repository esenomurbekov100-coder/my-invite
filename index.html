<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менин чакыруум</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #ffe4e1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #333; }
        button { padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .yes { background-color: #ff4081; color: white; }
        .no { background-color: #ddd; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Сен мени менен жолугушууга барасыңбы? 🐱</h1>
        <button class="yes" onclick="sendYes()">Ооба ❤️</button>
        <button class="no" onclick="closeApp()">Жок</button>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function sendYes() {
            tg.sendData("user_said_yes");
            tg.showAlert("Сонун! Жакында байланышам 😉");
        }
        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
