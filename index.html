<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Чакыруу 💌</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(to right, #24243e, #302b63, #0f0c29); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; }
    .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; position: relative; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #ff007f, #ff7b00, #ff007f); background-size: 200% 100%; animation: glow 2s linear infinite; }
    @keyframes glow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .emoji { font-size: 70px; margin-bottom: 15px; display: block; }
    h1 { font-size: 22px; margin-bottom: 10px; background: -webkit-linear-gradient(45deg, #ff007f, #ff7b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sender-name { font-size: 14px; color: #aaa; margin-bottom: 20px; }
    .message { background: rgba(0, 0, 0, 0.3); border-left: 4px solid #ff007f; padding: 20px 16px; border-radius: 12px; margin: 20px 0 30px; font-size: 18px; font-style: italic; color: #eee; line-height: 1.5; }
    .label { display: block; text-align: left; font-weight: 600; margin: 20px 0 10px; color: #ff7b00; font-size: 14px; text-transform: uppercase; }
    input[type="datetime-local"], select { width: 100%; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px; font-size: 16px; background: rgba(0, 0, 0, 0.4); color: #fff; outline: none; color-scheme: dark; }
    input:focus, select:focus { border-color: #ff007f; }
    button { width: 100%; padding: 16px; margin-top: 15px; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    button:active { transform: scale(0.95); }
    .btn-primary { background: linear-gradient(45deg, #ff007f, #ff7b00); color: #fff; box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #ccc; }
    .page { display: none; animation: fadeIn 0.5s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

    <div class="card">
        <!-- 1-БЕТ -->
        <div class="page active" id="page1">
            <span class="emoji">💌</span>
            <h1>Сизге чакыруу келди!</h1>
            <div class="sender-name" id="senderName"></div>
            <div class="message" id="customMessage"></div>
            <button class="btn-primary" onclick="goToPage(2)">Ооба, барам! ❤️</button>
            <button class="btn-secondary" onclick="sayNo()">Жок, бара албайм 💔</button>
        </div>

        <!-- 2-БЕТ -->
        <div class="page" id="page2">
            <span class="emoji">📅</span>
            <h1>Сонун! Качан жолугабыз?</h1>
            <label class="label">Күн жана убакыт:</label>
            <input type="datetime-local" id="date">
            <button class="btn-primary" onclick="checkDate()">Кийинки ➡️</button>
        </div>

        <!-- 3-БЕТ -->
        <div class="page" id="page3">
            <span class="emoji">🍔</span>
            <h1>Акыркы суроо...</h1>
            <label class="label">Эмне жегиңиз келет?</label>
            <select id="food">
                <option value="Суши жейбиз 🍣">Суши жейбиз 🍣</option>
                <option value="Пицца жейбиз 🍕">Пицца жейбиз 🍕</option>
                <option value="Бургер жейбиз 🍔">Бургер жейбиз 🍔</option>
                <option value="Лагман жейбиз 🍜">Лагман жейбиз 🍜</option>
                <option value="Манты жейбиз 🥟">Манты жейбиз 🥟</option>
                <option value="Кофе ичебиз ☕">Кофе ичебиз ☕</option>
                <option value="Мороженое жейбиз 🍦">Мороженое жейбиз 🍦</option>
            </select>
            <button class="btn-primary" onclick="sendData()">Жөнөтүү ✅</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const inviteId = params.get('invite_id') || '';
    const creatorId = params.get('creator_id') || '';
    const msg = params.get('msg') || 'Мени менен убакыт өткөрүүгө чакырам!';
    const sender = params.get('sender') || 'Бирөө';

    document.getElementById('senderName').textContent = `${sender} сизди чакырат:`;
    document.getElementById('customMessage').textContent = `"${msg}"`;

    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('date').min = now.toISOString().slice(0, 16);

    function goToPage(pageNum) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + pageNum).classList.add('active');
    }

    function sayNo() {
        tg.showAlert("Түшүндүм. Жакшы күн каалайм! 😊", function() { tg.close(); });
    }

    function checkDate() {
        if (!document.getElementById('date').value) {
            tg.showAlert("⚠️ Өтүнүч, күн менен убакытты тандаңыз!");
            return;
        }
        goToPage(3);
    }

    function sendData() {
        const dateVal = document.getElementById('date').value;
        const foodVal = document.getElementById('food').value;

        const payload = {
            invite_id: inviteId,
            creator_id: parseInt(creatorId),
            date: dateVal,
            food: foodVal
        };

        try {
            if (window.Telegram.WebApp.sendData) {
                window.Telegram.WebApp.sendData(JSON.stringify(payload));
            } else {
                tg.sendData(JSON.stringify(payload));
            }
            // Жабууну 1 секундга кечиктиребиз
            setTimeout(() => { tg.close(); }, 1000); 
            
        } catch (error) {
            tg.showAlert("КАТА: " + error.message);
        }
    }
</script>
</body>
</html>
